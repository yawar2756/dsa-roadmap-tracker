# Render Blueprint for the DSA Roadmap Tracker
# This project is a static HTML, CSS and JavaScript website.

services:
  - type: web
    name: dsa-roadmap-tracker
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
