# Render.com blueprint configuration for the DSA Roadmap Tracker
# Deploy as a free static site — no build step needed.

services:
  - type: web
    name: dsa-roadmap-tracker
    runtime: static
    buildCommand: echo "No build step required"
    staticPublishPath: ./
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
